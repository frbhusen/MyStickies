server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 20m;

    # Static files collected by Django
    location /static/ {
        alias /var/www/my-stickies/backend/staticfiles/;
        access_log off;
    }

    # Media uploads from Django
    location /media/ {
        alias /var/www/my-stickies/backend/media/;
        access_log off;
    }

    # API requests -> Gunicorn (Django)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the built frontend
    location / {
        root /var/www/my-stickies/frontend/dist;
        try_files $uri /index.html;
    }
}
